{% set name = "redis-py" %}
{% set version = "8.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/redis/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1f71accd16bb24383bd89fc213f901c04718d31ade0229f754d7ba37111c0661

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - async-timeout >=4.0.3
    # import redis.commands.search -> from typing_extensions import Self
    - typing-extensions  # [py<=310]
  run_constrained:
    # hiredis
    - hiredis >=3.2.0
    # xxhash
    - xxhash >=3.6.0,<3.7.0
    # ocsp
    - cryptography >=36.0.1
    - pyopenssl >=20.0.1
    - requests >=2.31.0
    # jwt
    - pyjwt >=2.13.0
    # circuit_breaker
    - pybreaker >=1.4.0
    # otel
    - opentelemetry-api >=1.39.1
    - opentelemetry-sdk >=1.39.1
    - opentelemetry-exporter-otlp-proto-http >=1.39.1

test:
  commands:
    - pip check
    - pytest -vv tests/test_client.py tests/test_asyncio/test_client.py -m "not no_mock_connections"
  imports:
    - redis
    - redis.asyncio
    - redis.auth
    - redis.commands
    - redis.commands.bf
    - redis.commands.json
    - redis.commands.search
    - redis.commands.timeseries
    - redis.commands.vectorset
    - redis.http
    - redis.multidb
  requires:
    - pip
    - pytest
    - pybreaker
    - pytest-asyncio
    - aiohttp
    - numpy
  source_files:
    - tests
    - pyproject.toml

about:
  home: https://github.com/redis/redis-py/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python client for Redis key-value store
  description: |
    The Python interface to the Redis key-value store. Requires a running
    Redis server.
  doc_url: https://pypi.python.org/pypi/redis
  dev_url: https://github.com/redis/redis-py/
extra:
  recipe-maintainers:
    - kwilcox
    - daf
